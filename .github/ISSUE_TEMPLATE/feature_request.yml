name: Feature request
description: Suggest a reading, a configuration option, or a compatibility fix.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Balance Pill intentionally stays small. Features that need a price
        table, token accounting, or a remote service are likely out of scope.
        Explain the user problem first, then the proposed change.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the plugin do instead? Include UI or route changes.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness version
      placeholder: 0.2.1-rc.2
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This request is not a security report.
          required: true
        - label: I searched existing issues and discussions.
          required: true
