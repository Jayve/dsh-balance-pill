<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="title desc">
  <title id="title">Balance Pill in the DeepSeek Harness composer dock</title>
  <desc id="desc">An illustration of the Harness chat screen. A blue-outlined pill at the right edge of the composer reads Balance ¥6.19 · This session ¥0.42.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#101828" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="pillGlow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f4f8ff"/>
      <stop offset="1" stop-color="#e8f0ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="470" fill="#f4f6f9"/>
  <rect x="40" y="20" width="1120" height="400" rx="20" fill="#ffffff" stroke="#e4e7ec" filter="url(#shadow)"/>

  <!-- window chrome -->
  <circle cx="72" cy="46" r="5" fill="#f97066"/>
  <circle cx="90" cy="46" r="5" fill="#fdb022"/>
  <circle cx="108" cy="46" r="5" fill="#32d583"/>
  <text x="132" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#475467">DeepSeek Harness</text>
  <text x="1092" y="51" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#98a2b3">desktop</text>
  <line x1="40" y1="68" x2="1160" y2="68" stroke="#eef1f5"/>

  <!-- transcript -->
  <rect x="760" y="96" width="304" height="42" rx="12" fill="#eef2f7"/>
  <rect x="780" y="110" width="210" height="7" rx="3.5" fill="#c7d0dd"/>
  <rect x="780" y="123" width="140" height="7" rx="3.5" fill="#d5dce6"/>

  <rect x="100" y="104" width="22" height="22" rx="7" fill="#2f6df6"/>
  <path d="M106 110h10M106 114h10M106 118h6" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="136" y="104" width="430" height="8" rx="4" fill="#e9edf3"/>
  <rect x="136" y="122" width="360" height="8" rx="4" fill="#eef1f6"/>
  <rect x="136" y="140" width="290" height="8" rx="4" fill="#eef1f6"/>

  <rect x="760" y="166" width="304" height="42" rx="12" fill="#eef2f7"/>
  <rect x="780" y="180" width="172" height="7" rx="3.5" fill="#c7d0dd"/>
  <rect x="780" y="193" width="112" height="7" rx="3.5" fill="#d5dce6"/>

  <rect x="136" y="196" width="390" height="8" rx="4" fill="#eef1f6"/>
  <rect x="136" y="214" width="430" height="8" rx="4" fill="#eef1f6"/>

  <!-- composer -->
  <rect x="80" y="252" width="1040" height="132" rx="16" fill="#fbfcfe" stroke="#dfe3ea"/>
  <text x="106" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#98a2b3">Ask anything…</text>

  <!-- session stats -->
  <text x="106" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#98a2b3">Cache hit 0 · Turns 3</text>

  <!-- the pill -->
  <rect x="792" y="322" width="304" height="38" rx="10" fill="url(#pillGlow)" stroke="#2f6df6" stroke-width="1.6" stroke-dasharray="6 4"/>
  <rect x="808" y="333" width="17" height="14" rx="3.5" fill="none" stroke="#3b5bdb" stroke-width="1.5"/>
  <path d="M817 333v14" stroke="#3b5bdb" stroke-width="1.5"/>
  <circle cx="821.5" cy="340" r="1.2" fill="#3b5bdb"/>
  <text x="834" y="346" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#2f4a7a">Balance ¥6.19</text>
  <circle cx="947" cy="340" r="1.6" fill="#98a2b3"/>
  <text x="958" y="346" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#5b6b85">This session ¥0.42</text>

  <!-- caption -->
  <text x="600" y="452" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#667085">Illustration: the pill sits at the right edge of the composer dock. The live UI follows the active Harness theme.</text>
</svg>
